[package]
name = "nodeloom-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "nodeloom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.7.2"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
nodeloom-agent = { path = "../../../crates/nodeloom-agent" }
nodeloom-core = { path = "../../../crates/nodeloom-core" }
nodeloom-master = { path = "../../../crates/nodeloom-master", features = ["embed-ui"] }
nodeloom-proto = { path = "../../../crates/nodeloom-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
