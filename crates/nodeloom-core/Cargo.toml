[package]
name = "nodeloom-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
mdns-sd = "0.21.5"
nodeloom-proto = { version = "0.1.0", path = "../nodeloom-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.36.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt", "macros", "sync", "time", "process", "fs", "io-util"] }
tracing = "0.1.44"
