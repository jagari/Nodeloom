[package]
name = "nodeloom-runner-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
nodeloom-core = { path = "../nodeloom-core" }
nodeloom-proto = { path = "../nodeloom-proto" }
# Plain HTTP to the model server on this machine: no TLS features needed.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
