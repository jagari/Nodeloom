[workspace]
resolver = "3"
members = ["crates/*"]
# The Tauri shell builds separately (own lockfile and target dir) so that
# `cargo test --workspace` does not need GUI system libraries.
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jagari/My-repository"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
