name: binaries

# Release builds of the agent and master (with the dashboard bundled) for
# every supported machine, packaged with the install scripts, and the
# desktop app's installers.
# - main / manual run: packages kept as artifacts for 30 days.
# - a `v*` tag: the same packages plus SHA256SUMS published as a GitHub
#   release (a pre-release when the tag has a suffix such as -beta.1), then
#   installed back from that release to prove the download path works.
# - a manual run on main with "release" checked: the same release for the
#   version in Cargo.toml, with the release creating its own `v<version>` tag.
#   It is for teammates who cannot push tags from their machine; the button
#   is under Actions → binaries → Run workflow.
# - a pull request runs it only when packaging changes, to keep CI minutes down.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish v<Cargo.toml version> as a GitHub release (main only)'
        type: boolean
        default: false
  pull_request:
    paths:
      - '.github/workflows/binaries.yml'
      - 'scripts/install.*'
      - 'scripts/package-readme.txt'
      - 'crates/nodeloom-master/src/ui.rs'
      - 'apps/desktop/src-tauri/**'

env:
  CARGO_TERM_COLOR: always
  # A tag push or a manual release run; either publishes a release.
  RELEASING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}

jobs:
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: apps/desktop/dist
          retention-days: 1
          if-no-files-found: error

  build:
    needs: dashboard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl): Raspberry Pi OS and the Ubuntu
          # releases behind JetPack ship older glibc than the build runners,
          # and a glibc-linked binary would refuse to start there (D14).
          - { name: linux-x64, runner: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: apps/desktop/dist
      - name: Install rustup if the image has none
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            # The binaries print the crate version; a tag that disagrees
            # would ship packages whose --version lies.
            [[ "$tag" == "$crate" ]] || { echo "tag v$tag != Cargo.toml $crate"; exit 1; }
            echo "label=$crate" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASING" == "true" ]]; then
            # The release tags this commit, so it must be what main ships.
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "manual releases run on main only"; exit 1; }
            echo "label=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "label=$crate-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }} -p nodeloom-agent -p nodeloom-master --features nodeloom-master/embed-ui
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          pkg="nodeloom-${{ steps.version.outputs.label }}-${{ matrix.name }}"
          src="target/${{ matrix.target }}/release"
          mkdir -p "dist/$pkg"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "$src/nodeloom-agent.exe" "$src/nodeloom-master.exe" scripts/install.ps1 "dist/$pkg/"
          else
            cp "$src/nodeloom-agent" "$src/nodeloom-master" scripts/install.sh "dist/$pkg/"
            chmod 755 "dist/$pkg/install.sh"
          fi
          if [[ "${{ matrix.target }}" == *-musl ]]; then
            # Must not depend on the system's C library.
            file "dist/$pkg/nodeloom-agent" | tee /dev/stderr | grep -q "static"
          fi
          cp LICENSE NOTICE "dist/$pkg/"
          cp scripts/package-readme.txt "dist/$pkg/README.txt"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
      # Built on the architecture it targets, so the package can be installed
      # and started right here, the way a user would.
      - name: Install and start (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unpack"
          tar -xzf "dist/$PKG.tar.gz" -C "$RUNNER_TEMP/unpack"
          NODELOOM_INSTALL_DIR="$RUNNER_TEMP/bin" "$RUNNER_TEMP/unpack/$PKG/install.sh"
          "$RUNNER_TEMP/bin/nodeloom-master" --bind 127.0.0.1:7878 --no-mdns --data-dir "$RUNNER_TEMP/data" &
          master=$!
          for _ in $(seq 1 50); do curl -sf http://127.0.0.1:7878/ -o page.html && break; sleep 0.2; done
          kill "$master"
          # The bundled dashboard, not the "built without" page.
          grep -q '/assets/' page.html
      - name: Install and start (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive "dist/$env:PKG.zip" -DestinationPath "$env:RUNNER_TEMP/unpack"
          & "$env:RUNNER_TEMP/unpack/$env:PKG/install.ps1" -InstallDir "$env:RUNNER_TEMP/bin"
          if ($LASTEXITCODE) { exit 1 }
          $master = Start-Process "$env:RUNNER_TEMP/bin/nodeloom-master.exe" -ArgumentList '--bind', '127.0.0.1:7878', '--no-mdns', '--data-dir', "$env:RUNNER_TEMP/data" -PassThru
          $page = $null
          foreach ($i in 1..50) {
            try { $page = (Invoke-WebRequest http://127.0.0.1:7878/ -UseBasicParsing).Content; break } catch { Start-Sleep -Milliseconds 200 }
          }
          Stop-Process $master
          if (-not ($page -match '/assets/')) { Write-Error 'dashboard not served'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: dist/${{ env.PKG }}.*
          retention-days: 30
          if-no-files-found: error

  # The desktop app: a master or an agent in a window and the tray (D16).
  # Linux packages are built on the oldest supported Ubuntu, because a
  # package only installs where the C library is at least as new.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, bundle: dmg, ext: dmg }
          - { name: windows-x64, runner: windows-latest, target: x86_64-pc-windows-msvc, bundle: nsis, ext: exe }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, bundle: nsis, ext: exe }
          - { name: linux-x64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bundle: deb, ext: deb }
          - { name: linux-arm64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bundle: deb, ext: deb }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - name: Install rustup if the image has none
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
            Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$arch-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain none --profile minimal
            Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
          }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop
      - name: Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          # The app reports its own version; it must match the release.
          app=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)
          conf=$(sed -n 's/^  "version": "\(.*\)",/\1/p' apps/desktop/src-tauri/tauri.conf.json)
          [[ "$app" == "$crate" && "$conf" == "$crate" ]] ||
            { echo "desktop app version ($app, tauri.conf.json $conf) != Cargo.toml $crate"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* || "$RELEASING" == "true" ]]; then
            echo "label=$crate" >> "$GITHUB_OUTPUT"
          else
            echo "label=$crate-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the installer
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          found=$(find "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}" \
            -maxdepth 1 -name "*.${{ matrix.ext }}" | head -n 1)
          [ -n "$found" ] || { echo "no .${{ matrix.ext }} was built"; exit 1; }
          mkdir -p dist
          out="dist/nodeloom-desktop-${{ steps.version.outputs.label }}-${{ matrix.name }}.${{ matrix.ext }}"
          cp "$found" "$out"
          ls -l dist
          echo "OUT=$out" >> "$GITHUB_ENV"
      # Installs the package the way a user would (its dependencies must
      # resolve) and starts it as a master on a virtual display: the
      # machine must join its own cluster.
      - name: Install and start (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y "./$OUT"
          home="$RUNNER_TEMP/app"
          mkdir -p "$home/config/io.github.jagari.nodeloom"
          echo '{"role":"master"}' > "$home/config/io.github.jagari.nodeloom/settings.json"
          XDG_CONFIG_HOME="$home/config" XDG_DATA_HOME="$home/data" \
            xvfb-run -a nodeloom-desktop > "$home/app.log" 2>&1 &
          app=$!
          nodes=0
          for _ in $(seq 1 60); do
            if [ -f "$home/data/nodeloom/master/admin-token" ]; then
              nodes=$(curl -sf -H "Authorization: Bearer $(cat "$home/data/nodeloom/master/admin-token")" \
                http://127.0.0.1:7878/api/state | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["nodes"]))' || echo 0)
              [ "$nodes" = 1 ] && break
            fi
            sleep 1
          done
          kill "$app" || true
          cat "$home/app.log"
          [ "$nodes" = 1 ] || { echo "the app's machine did not join its own cluster"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: nodeloom-desktop-${{ steps.version.outputs.label }}-${{ matrix.name }}
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nodeloom-*
          path: dist
          merge-multiple: true
      - name: Tag
        id: tag
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
            # An existing tag means this version already shipped (or is being
            # shipped by a tag push); never move or reuse it.
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists; bump the version in Cargo.toml first"
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum nodeloom-* > SHA256SUMS
          cat SHA256SUMS
          # Notes = this version's section of CHANGELOG.md.
          awk -v v="${TAG#v}" '/^## /{p = index($0, "[" v "]") > 0; next} p' ../CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          # On a manual run the tag does not exist yet; --target creates it on
          # the commit these packages were built from.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Nodeloom $TAG" \
            --notes-file notes.md "${flags[@]}" nodeloom-* SHA256SUMS

  # Installs from the published release the way a teammate would, through
  # the GitHub CLI, so a broken download path is caught at release time.
  verify-release:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install from the release
        env:
          GH_TOKEN: ${{ github.token }}
          NODELOOM_REPO: ${{ github.repository }}
          NODELOOM_VERSION: ${{ needs.release.outputs.tag }}
          NODELOOM_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          set -euo pipefail
          sh scripts/install.sh
          "$NODELOOM_INSTALL_DIR/nodeloom-agent" --version | grep -F "${NODELOOM_VERSION#v}"
